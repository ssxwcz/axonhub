name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Verify production dependency graphs
        run: |
          ./scripts/verify-go-sse-dependency-test.sh
          ./scripts/verify-go-sse-dependency.sh

      - name: Update VERSION file
        if: ${{ !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Updating VERSION file to: $VERSION"
          echo "$VERSION" > internal/build/VERSION
          git add internal/build/VERSION

      - name: Commit VERSION file
        if: ${{ !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        continue-on-error: true
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if VERSION files have changes
          if git diff --cached --quiet VERSION internal/build/VERSION; then
            echo "No changes to VERSION files"
          else
            # Commit VERSION files with [skip ci] to avoid triggering other workflows
            git commit -m "chore: update VERSION to ${GITHUB_REF#refs/tags/} [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      # goreleaser keeps releases as drafts (release.draft: true) so that a failed
      # run never leaves a half-published release. Re-running the same tag would
      # otherwise pile up stale drafts, so drop any draft left for this tag first.
      - name: Remove stale draft releases for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/$REPO/releases?per_page=100" \
                --jq ".[] | select(.draft == true and .tag_name == \"$TAG\") | .id")
          if [ -z "$ids" ]; then
            echo "No stale draft for $TAG"
            exit 0
          fi
          for id in $ids; do
            echo "Deleting stale draft release $id for $TAG"
            gh api -X DELETE "repos/$REPO/releases/$id"
          done

      # goreleaser derives the changelog from the previous tag *reachable* from the
      # current one (git describe semantics). This fork re-syncs upstream with
      # `git rebase`, which rewrites unstable and orphans older tags, so goreleaser
      # finds no reachable previous tag and falls back to the whole repository
      # history. Pin the previous tag to the newest published release instead;
      # `git log A..B` still works when A is not an ancestor of B.
      - name: Resolve previous release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev=$(gh release list --exclude-drafts --limit 200 --json tagName \
                 --jq '.[].tagName' \
                 | awk -v cur="$CURRENT" '$0 != cur' \
                 | sort -V | tail -n1)
          if [ -n "$prev" ]; then
            echo "Changelog will span $prev..$CURRENT"
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
          else
            echo "No published release found; goreleaser will use its default"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "Published $TAG"
